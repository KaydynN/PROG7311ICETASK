version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: MedicalBooking.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  web:
    build:
      context: .
      dockerfile: MedicalBooking.Web/Dockerfile
    ports:
      - "5001:8081"
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - API_BASE_URL=http://api:8080
    depends_on:
      - api